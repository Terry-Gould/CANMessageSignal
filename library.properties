sentence=DBC-style CAN message and signal packing, sending, and decoding for ACANFD_SAME.
paragraph=This library uses the concept of CAN messages and signals to pack, send, match, and decode CAN and CAN FD frames. It largely follows Vector DBC signal conventions, while adding convenience classes for byte-aligned and single-bit signals. It requires ACANFD_SAME.
